# Semantic release: a versão sai das mensagens de commit desde a última tag.
#   fix: -> patch   feat: -> minor   feat!: / BREAKING CHANGE -> major
# Commits de outros tipos (chore:, docs:...) não geram release.
# Cada release leva o Remendo.app zipado + appcast.xml (lido pelo Sparkle no app).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: npx --yes -p semantic-release@24 -p @semantic-release/exec@6 -p conventional-changelog-conventionalcommits@8 semantic-release
