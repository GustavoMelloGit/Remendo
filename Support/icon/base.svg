<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6FA5"/>
      <stop offset="1" stop-color="#22385F"/>
    </linearGradient>
    <pattern id="twill" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="sheen" cx="0.35" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Grade padrão do macOS: 824px com raio 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#denim)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#twill)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
</svg>
